name: TestPyPI

on:
  push:
    branches:
      - testpypi

permissions: read-all

jobs:
  pypi:
    name: Publish to TestPyPI
    permissions:
      id-token: write
    runs-on: ubuntu-slim
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ragged-stubs
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv build
      - uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
      - run: uv publish --index testpypi --trusted-publishing always
